<div class="doc-layout" [class.nav-open]="navOpen()">
  <app-nav-toggle [open]="navOpen()" (toggled)="toggleNav()" />
  @if (navOpen()) {
    <button class="backdrop" type="button" aria-label="Close index" (click)="closeNav()"></button>
  }
  <aside class="sidebar">
    <app-index-nav />
  </aside>
  <div class="article" id="main">
    <router-outlet />
  </div>
</div>
