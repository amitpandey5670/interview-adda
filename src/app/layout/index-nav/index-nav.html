<nav class="index-nav" aria-label="Document index">
  @for (stage of stages(); track stage.id) {
    <section class="stage">
      <h2>{{ stage.title }}</h2>
      @for (module of stage.modules; track module.id) {
        <div class="module">
          <button type="button" class="module-toggle" [attr.aria-expanded]="isModuleOpen(module.slug)" (click)="toggleModule(module.slug)">
            {{ module.order }}. {{ module.title }}
          </button>
          @if (isModuleOpen(module.slug)) {
            <ul>
              @for (topic of module.topics; track topic.id) {
                <li>
                  <a routerLinkActive="active" [routerLink]="['/docs', language(), 'modules', module.slug, 'topics', topic.slug]">{{ topic.title }}</a>
                </li>
              }
              <li>
                <a [routerLink]="['/docs', language(), 'modules', module.slug, 'mindmap']">Mind map</a>
              </li>
              <li>
                <a [routerLink]="['/docs', language(), 'modules', module.slug, 'quick-overview']">Quick overview</a>
              </li>
              <li>
                <a [routerLink]="['/docs', language(), 'modules', module.slug, 'interview']">Interview</a>
              </li>
            </ul>
          }
        </div>
      }
    </section>
  }
</nav>
