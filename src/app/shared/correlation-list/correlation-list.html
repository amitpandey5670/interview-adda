@if (items().length) {
  <section>
    <h2>JavaScript and TypeScript correlations</h2>
    <ul>
      @for (item of items(); track item.futureTopicSlug) {
        <li>
          <strong>{{ item.language }} — {{ item.concept }}.</strong>
          {{ item.note }}
          <span class="slug">Later: {{ item.futureTopicSlug }}</span>
        </li>
      }
    </ul>
  </section>
}
