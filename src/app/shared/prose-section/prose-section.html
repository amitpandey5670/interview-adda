<section class="prose-section">
  <h2>{{ section().heading }}</h2>
  @if (section().prose) {
    <p>{{ section().prose }}</p>
  }
  @for (snippet of section().snippets ?? []; track snippet.label + ':' + snippet.code.length) {
    <app-code-block
      [language]="snippet.language"
      [label]="snippet.label"
      [code]="snippet.code"
      [explanation]="snippet.explanation"
    />
  }
  @if (section().blocks?.length) {
    <app-content-blocks [blocks]="section().blocks ?? []" />
  }
</section>
