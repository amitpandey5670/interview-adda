<section class="prose-section">
  <h2>{{ section().heading }}</h2>
  <p>{{ section().prose }}</p>
  @for (snippet of section().snippets ?? []; track snippet.label) {
    <app-code-block
      [language]="snippet.language"
      [label]="snippet.label"
      [code]="snippet.code"
      [explanation]="snippet.explanation"
    />
  }
</section>
