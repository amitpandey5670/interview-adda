<div class="concept-cards">
  @for (card of cards(); track card.id) {
    <article class="card">
      <h3>{{ card.title }}</h3>
      <p>{{ card.summary }}</p>
      @if (card.example) {
        <p class="example">{{ card.example }}</p>
      }
      @if (card.topicSlug) {
        <a [routerLink]="['/docs', language(), 'modules', moduleSlug(), 'topics', card.topicSlug]">Read topic</a>
      }
    </article>
  }
</div>
