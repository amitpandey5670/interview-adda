<div class="steps-block">
  <h3>{{ title() }}</h3>
  <ol>
    @for (item of items(); track item.title) {
      <li>
        <strong>{{ item.title }}</strong>
        <p>{{ item.body }}</p>
        @if (item.snippet; as snippet) {
          <app-code-block
            [language]="snippet.language"
            [label]="snippet.label"
            [code]="snippet.code"
            [explanation]="snippet.explanation"
          />
        }
      </li>
    }
  </ol>
</div>
