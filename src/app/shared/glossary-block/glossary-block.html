<div class="glossary-block">
  <h3>{{ title() }}</h3>
  <dl>
    @for (entry of entries(); track entry.term) {
      <div class="entry">
        <dt>
          {{ entry.term }}
          @if (entry.shortForm) {
            <span class="short">({{ entry.shortForm }})</span>
          }
        </dt>
        <dd>
          <strong>{{ entry.longForm }}</strong>
          — {{ entry.plainDefinition }}
          @if (entry.example) {
            <p class="example">Example: {{ entry.example }}</p>
          }
        </dd>
      </div>
    }
  </dl>
</div>
