@if (links().length) {
  <section class="related">
    <h2>Related topics</h2>
    <ul>
      @for (link of links(); track link.id) {
        <li>
          <a [routerLink]="['/docs', link.language, 'modules', link.moduleSlug, 'topics', link.topicSlug]">
            {{ link.title }}
          </a>
        </li>
      }
    </ul>
  </section>
}
