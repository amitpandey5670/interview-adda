<figure class="mermaid-diagram">
  <figcaption>{{ diagram().title }}</figcaption>
  <div #host class="mermaid-host" role="img" [attr.aria-label]="diagram().title"></div>
  @if (error(); as message) {
    <pre class="mermaid-error">{{ message }}</pre>
  }
  @if (diagram().caption) {
    <p class="caption">{{ diagram().caption }}</p>
  }
</figure>
