@if (page(); as doc) {
  <article>
    <h1>{{ doc.title }}</h1>
    @for (item of doc.items; track item.question) {
      <section class="qa">
        <h2>{{ item.question }}</h2>
        <p>{{ item.answer }}</p>
        <p class="sixty"><strong>60 seconds.</strong> {{ item.sixtySeconds }}</p>
        @if (item.followUps.length) {
          <p>Follow-ups</p>
          <ul>
            @for (follow of item.followUps; track follow) {
              <li>{{ follow }}</li>
            }
          </ul>
        }
      </section>
    }
  </article>
}
