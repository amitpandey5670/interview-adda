@if (mindmap(); as doc) {
  <article class="mindmap-page">
    <h1>{{ doc.title }}</h1>
    @if (doc.intro) {
      <p class="intro">{{ doc.intro }}</p>
    }
    @if (doc.overviewDiagram) {
      <app-mermaid-diagram [diagram]="doc.overviewDiagram" />
    }
    @if (doc.conceptCards?.length) {
      <h2>Concept cards</h2>
      <app-concept-cards [cards]="doc.conceptCards!" [language]="language()" [moduleSlug]="moduleSlug()" />
    }
    @if (doc.revisionDiagram) {
      <h2>Revision map</h2>
      <app-mermaid-diagram [diagram]="doc.revisionDiagram" />
    }
    @if (doc.nodes?.length) {
      <h2>Topic tree</h2>
      <app-mindmap-canvas [mindmap]="doc" />
    }
  </article>
}
