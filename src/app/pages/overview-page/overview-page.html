@if (page(); as doc) {
  <article>
    <p class="kicker">Overview</p>
    <h1>{{ doc.title }}</h1>
    <p class="hook">{{ doc.hook }}</p>
    @for (section of doc.sections; track section.heading) {
      <app-prose-section [section]="section" />
    }
    <section>
      <h2>How to study</h2>
      @for (map of doc.timeMaps; track map.duration) {
        <p><strong>{{ map.duration }}.</strong> {{ map.focus }}</p>
      }
    </section>
    <app-official-sources [sources]="doc.officialSources" />
  </article>
}
