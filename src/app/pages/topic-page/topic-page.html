@if (topic(); as doc) {
  <article [class]="'hint-' + (doc.animationHint ?? 'none')">
    <p class="kicker">Topic @if (doc.introducedIn) { · {{ doc.introducedIn }} }</p>
    <h1>{{ doc.title }}</h1>
    <p class="hook">{{ doc.hook }}</p>
    @for (section of doc.sections; track section.heading) {
      <app-prose-section [section]="section" />
    }
    <app-callout-list title="Interview takeaways" [items]="doc.interviewTakeaways" />
    <app-callout-list title="Common pitfalls" [items]="doc.commonPitfalls" />
    <app-related-links [links]="related()" />
    <app-correlation-list [items]="doc.jsTsCorrelations" />
    <app-official-sources [sources]="doc.officialSources" />
  </article>
}
